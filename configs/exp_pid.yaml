# ==============================================================================
# EXPERIMENT 1: BASELINE DUAL-LOOP CASCADE PID CONTROLLER
# ==============================================================================

system:
  experiment_name: "exp_cascade_pid"
  mode: "pid"
  seed: 42
  device: "cpu"
  output_dir: "outputs"

robot_physics:
  M: 0.360
  m: 0.030
  l: 0.031
  r: 0.020
  J: 0.00072
  b: 0.050
  Km: 0.28
  V_bat: 7.4
  deadband: 80.0
  Ts: 0.005
  max_pwm: 999.0
  latency_steps: 1

baseline_pid:
  kp_angle: 55.85
  kd_angle: 3.84
  kp_pos: 2.005
  kd_pos: 3.151

environment:
  sim_duration: 3.0
  initial_tilt_deg: 10.0
  kick_force: -1.2
  kick_start_time: 1.0
  kick_duration: 0.08
  domain_randomization:
    enabled: false

