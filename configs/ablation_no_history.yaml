# ==============================================================================
# EXPERIMENT 4: ABLATION STUDY - TEMPORAL HISTORY BUFFER AWARENESS
# ==============================================================================

system:
  experiment_name: "ablation_no_history"
  mode: "ablation_history"
  seed: 42
  device: "cpu"
  output_dir: "outputs"

robot_physics:
  M: 0.360
  m: 0.030
  l: 0.031
  r: 0.020
  J: 0.00072
  b: 0.050
  Km: 0.28
  V_bat: 7.4
  deadband: 80.0
  Ts: 0.005
  max_pwm: 999.0
  latency_steps: 1

adrc_controller:
  b0: 4.3135
  omega_o: 48.0
  omega_c: 18.5
  pos_kp: 2.005
  pos_kd: 3.151

rl_hyperparameters:
  history_len: 0      # No history (pure Markovian 4D state)
  input_dim: 4        # [theta, dtheta, x, v]
  hidden_dims: [32, 32]
  output_dim: 1
  action_scale: 450.0
  population_size: 64
  num_generations: 50
  learning_rate: 0.05
  sigma: 0.08

environment:
  sim_duration: 3.0
  initial_tilt_deg: 10.0
  kick_force: -1.2
  kick_start_time: 1.0
  kick_duration: 0.08
  domain_randomization:
    enabled: true
    mass_variation: 0.25
    friction_variation: 0.30
    battery_sag_pct: 0.15

