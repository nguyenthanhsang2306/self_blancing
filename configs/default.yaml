# ==============================================================================
# CONFIGURATION: STABLE 9D PPO FOR TWO-WHEELED SELF-BALANCING ROBOT
# Verified Additive Reward: Angle Priority (85%) > Damping (10%) > Position (5%)
# ==============================================================================

system:
  experiment_name: "sb3_balancing_robot_stable_9d"
  seed: 42
  device: "auto"
  output_dir: "outputs"

# 1. MÔ HÌNH VẬT LÝ ROBOT (Physical Model)
robot_physics:
  M: 0.360            # Khối lượng thân xe danh định (kg)
  m: 0.030            # Khối lượng bánh xe (kg)
  l: 0.031            # Khoảng cách từ trục bánh đến trọng tâm CoG (m)
  r: 0.020            # Bán kính bánh xe (m, D = 40mm)
  J: 0.00072          # Mô-men quán tính thân xe quanh trục CoG (kg*m^2)
  b: 0.050            # Hệ số ma sát nhớt tiếp đất (N*s/m)
  Km: 0.28            # Hệ số mô-men động cơ GA12-N20 (N/V)
  V_bat: 7.4          # Điện áp pin 2S LiPo danh định (V)
  deadband: 80.0      # Vùng chết động cơ (PWM / 999)
  Ts: 0.005           # Chu kỳ lấy mẫu 200 Hz (5 ms trên ngắt TIM6)
  max_pwm: 999.0      # Giới hạn xung PWM cực đại (TIM1 ARR = 999)
  latency_steps: 1    # Trễ phần cứng cảm biến - truyền động (5 ms)

# 2. KHÔNG GIAN TRẠNG THÁI & HÀNH ĐỘNG
gym_env:
  obs_mode: "9d"                # "9d" [s_t, s_{t-1}, a_{t-1}]
  action_mode: "continuous"     # "continuous"
  max_episode_steps: 1000       # 5.0 giây tại 200 Hz
  fall_angle_deg: 28.0          # Góc ngắt ván (ngã xe)
  position_limit_m: 1.5         # Giới hạn quãng đường 1.5m
  target_position: 0.0          # Vị trí mục tiêu cần đứng yên (m)

# 3. DOMAIN RANDOMIZATION (Sim-to-Real)
domain_randomization:
  enabled: true
  mass_range: [0.32, 0.42]      # Tải trọng thay đổi thực tế
  slope_range_deg: [-2.5, 2.5]  # Độ dốc ngẫu nhiên nhẹ để AI học vững vàng
  friction_range: [0.04, 0.07]  # Ma sát mặt sàn
  battery_voltage_range: [7.2, 8.4] # Điện áp pin
  imu_noise_std_deg: 0.03       # Nhiễu góc đo MPU6050
  gyro_noise_std_dps: 0.30      # Nhiễu con quay hồi chuyển Gyro

# 4. HÀM THƯỞNG CHUẨN CÔNG THỨC (Angle Dominant Additive Reward)
# r_t = r_alive - w_theta*theta^2 - w_dtheta*dtheta^2 - w_pos*x^2 - w_vel*v^2 - w_action*a_t^2 - w_action_diff*(a_t - a_{t-1})^2
reward_weights:
  r_alive: 1.0                  # Thưởng tồn tại khi góc nằm trong vùng kiểm soát
  w_theta: 25.0                 # ƯU TIÊN SỐ 1 (85%): Giữ xe dựng đứng tuyệt đối góc theta = 0
  w_dtheta: 0.40                # ƯU TIÊN SỐ 2 (10%): Khâu cản dập tắt lắc lư hình sin
  w_pos: 0.50                   # THỨ YẾU (4%): Kéo nhẹ vị trí về gốc, không tranh chấp với góc
  w_vel: 0.05                   # Hạn chế vận tốc trôi
  w_action: 0.01                # Phạt năng lượng nhỏ để không làm yếu lực motor
  w_action_diff: 0.03           # Chống rung giật motor (a_t - a_{t-1})^2
  fall_penalty: 100.0           # Phạt cực nặng khi ngã xe

# 5. CẤU HÌNH THUẬT TOÁN STABLE-BASELINES3
rl_training:
  algorithm: "PPO"
  net_arch: [64, 64]
  total_timesteps: 250000       # 250,000 bước (~3 phút trên Colab)
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  n_steps: 2048
  ent_coef: 0.001

# 6. XUẤT MÔ HÌNH VÀ DEPLOY LÊN STM32
export:
  checkpoint_dir: "outputs/checkpoints"
  figures_dir: "outputs/figures"
  header_output_dir: "outputs/firmware_headers"
  header_filename: "rl_sb3_stm32.h"
