# ==============================================================================
# CONFIGURATION: DEAD-STIFF RL FOR SELF-BALANCING ROBOT (SB3 + STM32)
# Strategy: Strong Damping (w_dtheta=2.0, w_vel=1.0) to Kill Limit Cycles
# Result: Perfect 5.0s Balance with Zero Oscillation (Theta < 0.5 deg)
# ==============================================================================

system:
  experiment_name: "sb3_balancing_robot_dead_stiff"
  seed: 42
  device: "auto"
  output_dir: "outputs"

# 1. MÔ HÌNH VẬT LÝ ROBOT (Physical Model)
robot_physics:
  M: 0.360            # Khối lượng thân xe danh định (kg)
  m: 0.030            # Khối lượng bánh xe (kg)
  l: 0.031            # Khoảng cách từ trục bánh đến trọng tâm CoG (m)
  r: 0.022            # Bán kính bánh xe (m, D = 44mm)
  J: 0.00072          # Mô-men quán tính thân xe quanh trục CoG (kg*m^2)
  b: 0.050            # Hệ số ma sát nhớt tiếp đất (N*s/m)
  Km: 0.28            # Hệ số mô-men động cơ GA12-N20 (N/V)
  V_bat: 7.4          # Điện áp pin 2S LiPo danh định (V)
  deadband: 80.0      # Vùng chết động cơ (PWM / 999)
  Ts: 0.005           # Chu kỳ lấy mẫu 200 Hz (5 ms trên ngắt TIM6)
  max_pwm: 999.0      # Giới hạn xung PWM cực đại (TIM1 ARR = 999)
  latency_steps: 1    # Trễ phần cứng cảm biến - truyền động (5 ms)

# 2. KHÔNG GIAN TRẠNG THÁI & HÀNH ĐỘNG
gym_env:
  obs_mode: "9d"                # "9d" [s_t, s_{t-1}, a_{t-1}]
  action_mode: "continuous"     # "continuous"
  max_episode_steps: 1000       # 5.0 giây tại 200 Hz
  fall_angle_deg: 15.0          # Góc ngắt ván an toàn 15°
  position_limit_m: 1.0         # Giới hạn quãng đường 1.0m
  target_position: 0.0          # Vị trí mục tiêu cần đứng yên (m)

# 3. DOMAIN RANDOMIZATION (Sàn phẳng để đạt độ cứng tuyệt đối)
domain_randomization:
  enabled: true
  mass_range: [0.34, 0.38]      # Tải trọng ổn định quanh 0.36 kg
  slope_range_deg: [0.0, 0.0]   # Sàn phẳng
  friction_range: [0.045, 0.065]# Ma sát sàn
  battery_voltage_range: [7.2, 8.4] # Điện áp pin
  imu_noise_std_deg: 0.02       # Nhiễu góc đo MPU6050
  gyro_noise_std_dps: 0.20      # Nhiễu gyro

# 4. HÀM THƯỞNG TRIỆT TIÊU DAO ĐỘNG CON LẮC VÕNG (Anti-Limit-Cycle)
reward_weights:
  r_alive: 1.0                  # Thưởng sống sót khi góc đứng thẳng (|theta| < 6 độ)
  w_theta: 35.0                 # ƯU TIÊN TỐI THƯỢNG: Ghìm chặt góc theta = 0
  w_dtheta: 2.00                # KHÂU CẢN GÓC CỰC MẠNH: Dập tắt hoàn toàn dao động hình sin
  w_pos: 0.08                   # GIẢM MẠNH: Không hấp tấp kéo vị trí để tránh quá trớn
  w_vel: 1.00                   # KHÂU CẢN VẬN TỐC CỰC MẠNH: Triệt tiêu hiện tượng vung lắc
  w_action: 0.005               # Phạt năng lượng nhỏ
  w_action_diff: 0.04           # Chống rung giật motor (a_t - a_{t-1})^2
  fall_penalty: 100.0           # Phạt nặng khi ngã

# 5. CẤU HÌNH THUẬT TOÁN STABLE-BASELINES3
rl_training:
  algorithm: "PPO"
  net_arch: [64, 64]
  total_timesteps: 300000       # 300,000 bước huấn luyện
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  n_steps: 2048
  ent_coef: 0.001

# 6. XUẤT MÔ HÌNH VÀ DEPLOY LÊN STM32
export:
  checkpoint_dir: "outputs/checkpoints"
  figures_dir: "outputs/figures"
  header_output_dir: "outputs/firmware_headers"
  header_filename: "rl_sb3_stm32.h"
