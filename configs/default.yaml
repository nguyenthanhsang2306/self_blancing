# ==============================================================================
# CONFIGURATION: REINFORCEMENT LEARNING FOR SELF-BALANCING ROBOT (SB3 + STM32)
# Standard 6-Step RL with Domain Randomization & 9D Temporal Observation Space
# ==============================================================================

system:
  experiment_name: "sb3_balancing_robot_9d"
  seed: 42
  device: "auto"
  output_dir: "outputs"

# 1. MÔ HÌNH VẬT LÝ ROBOT (Physical Model)
robot_physics:
  M: 0.360            # Khối lượng thân xe danh định (kg)
  m: 0.030            # Khối lượng bánh xe (kg)
  l: 0.031            # Khoảng cách từ trục bánh đến trọng tâm CoG (m)
  r: 0.020            # Bán kính bánh xe (m, D = 40mm)
  J: 0.00072          # Mô-men quán tính thân xe quanh trục CoG (kg*m^2)
  b: 0.050            # Hệ số ma sát nhớt tiếp đất (N*s/m)
  Km: 0.28            # Hệ số mô-men động cơ GA12-N20 (N/V)
  V_bat: 7.4          # Điện áp pin 2S LiPo danh định (V)
  deadband: 80.0      # Vùng chết động cơ (PWM / 999)
  Ts: 0.005           # Chu kỳ lấy mẫu 200 Hz (5 ms trên ngắt TIM6)
  max_pwm: 999.0      # Giới hạn xung PWM cực đại (TIM1 ARR = 999)
  latency_steps: 1    # Trễ phần cứng cảm biến - truyền động (5 ms)

# 2. KHÔNG GIAN TRẠNG THÁI & HÀNH ĐỘNG
gym_env:
  obs_mode: "9d"                # "9d" [s_t, s_{t-1}, a_{t-1}] để tự nhận diện dốc/tải trọng, hoặc "4d"
  action_mode: "continuous"     # "continuous" (PPO) hoặc "discrete" (DQN)
  discrete_actions: [-1.0, -0.3, -0.1, 0.0, 0.1, 0.3, 1.0] # 7 mức lực mượt cho DQN
  max_episode_steps: 1000       # 5.0 giây tại 200 Hz
  fall_angle_deg: 30.0          # Góc ngắt ván (ngã xe)
  position_limit_m: 1.5         # Giới hạn quãng đường di chuyển (m)
  target_position: 0.0          # Vị trí mục tiêu cần đứng yên (m)

# 3. DOMAIN RANDOMIZATION (Mấu chốt Sim-to-Real thích nghi tải trọng & dốc)
domain_randomization:
  enabled: true
  mass_range: [0.28, 0.46]      # Thay đổi khối lượng tải trọng từ -22% đến +28%
  slope_range_deg: [-5.0, 5.0]  # Độ dốc mặt đường ngẫu nhiên ±5 độ (lên/xuống dốc)
  friction_range: [0.03, 0.08]  # Ma sát mặt sàn từ trơn trượt đến bám
  battery_voltage_range: [6.8, 8.4] # Pin 2S từ lúc gần cạn đến sạc đầy
  imu_noise_std_deg: 0.05       # Nhiễu góc đo MPU6050 (độ)
  gyro_noise_std_dps: 0.50      # Nhiễu con quay hồi chuyển (độ/giây)

# 4. THIẾT KẾ HÀM THƯỞNG TOÀN DIỆN (Reward Shaping)
# r_t = - w_theta*theta^2 - w_dtheta*dtheta^2 - w_pos*x^2 - w_vel*v^2 - w_action*a_t^2 - w_action_diff*(a_t - a_{t-1})^2 + r_alive
reward_weights:
  survival: 1.0                 # r_alive: Thưởng tồn tại mỗi bước không bị ngã
  w_theta: 12.0                 # Phạt độ lệch góc nghiêng thân xe
  w_dtheta: 0.15                # Phạt vận tốc góc lắc lư
  w_pos: 2.0                    # Phạt trôi xa vị trí mục tiêu
  w_vel: 0.10                   # Phạt tốc độ di chuyển để xe đứng đằm chắc
  w_action: 0.05                # Phạt tiêu tốn năng lượng motor (tiết kiệm pin & mát động cơ)
  w_action_diff: 0.10           # Phạt rung giật (a_t - a_{t-1})^2, ép lực xuất êm như bộ lọc
  fall_penalty: 50.0            # Phạt nặng khi bị ngã xe

# 5. CẤU HÌNH THUẬT TOÁN STABLE-BASELINES3
rl_training:
  algorithm: "PPO"              # PPO chuẩn công nghiệp
  net_arch: [64, 64]            # 2 tầng ẩn [64, 64] tối ưu để nhúng STM32
  total_timesteps: 250000       # 250,000 bước huấn luyện
  learning_rate: 0.0003
  gamma: 0.99                   # Hệ số chiết khấu
  batch_size: 64
  n_steps: 2048                 # Số bước rollout mỗi lần cập nhật PPO
  ent_coef: 0.001               # Entropy exploration

# 6. XUẤT MÔ HÌNH VÀ DEPLOY LÊN STM32
export:
  checkpoint_dir: "outputs/checkpoints"
  figures_dir: "outputs/figures"
  header_output_dir: "outputs/firmware_headers"
  header_filename: "rl_sb3_stm32.h"
