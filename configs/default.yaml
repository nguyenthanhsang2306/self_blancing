# ==============================================================================
# CONFIGURATION: ULTRA-STIFF RL FOR SELF-BALANCING ROBOT (SB3 + STM32)
# Enhanced Damping & Anti-Sway Reward Formulation (Max Theta < 0.8 deg, Pos < 3 cm)
# ==============================================================================

system:
  experiment_name: "sb3_balancing_robot_stiff_9d"
  seed: 42
  device: "auto"
  output_dir: "outputs"

# 1. MÔ HÌNH VẬT LÝ ROBOT (Physical Model)
robot_physics:
  M: 0.360            # Khối lượng thân xe danh định (kg)
  m: 0.030            # Khối lượng bánh xe (kg)
  l: 0.031            # Khoảng cách từ trục bánh đến trọng tâm CoG (m)
  r: 0.020            # Bán kính bánh xe (m, D = 40mm)
  J: 0.00072          # Mô-men quán tính thân xe quanh trục CoG (kg*m^2)
  b: 0.050            # Hệ số ma sát nhớt tiếp đất (N*s/m)
  Km: 0.28            # Hệ số mô-men động cơ GA12-N20 (N/V)
  V_bat: 7.4          # Điện áp pin 2S LiPo danh định (V)
  deadband: 80.0      # Vùng chết động cơ (PWM / 999)
  Ts: 0.005           # Chu kỳ lấy mẫu 200 Hz (5 ms trên ngắt TIM6)
  max_pwm: 999.0      # Giới hạn xung PWM cực đại (TIM1 ARR = 999)
  latency_steps: 1    # Trễ phần cứng cảm biến - truyền động (5 ms)

# 2. KHÔNG GIAN TRẠNG THÁI & HÀNH ĐỘNG
gym_env:
  obs_mode: "9d"                # "9d" [s_t, s_{t-1}, a_{t-1}]
  action_mode: "continuous"     # "continuous"
  max_episode_steps: 1000       # 5.0 giây tại 200 Hz
  fall_angle_deg: 25.0          # Siết góc ngắt từ 30° xuống 25° để ép AI phải giữ thẳng
  position_limit_m: 1.0         # Giới hạn quãng đường 1.0m
  target_position: 0.0          # Điểm neo giữ vị trí đứng yên (m)

# 3. DOMAIN RANDOMIZATION (Sim-to-Real)
domain_randomization:
  enabled: true
  mass_range: [0.30, 0.44]      # Biến thiên tải trọng thực tế
  slope_range_deg: [-4.0, 4.0]  # Dốc nghiêng mặt đường ±4 độ
  friction_range: [0.035, 0.075]# Ma sát mặt sàn
  battery_voltage_range: [7.0, 8.4] # Điện áp pin
  imu_noise_std_deg: 0.04       # Nhiễu góc đo MPU6050
  gyro_noise_std_dps: 0.40      # Nhiễu gyro

# 4. THIẾT KẾ HÀM THƯỞNG SIÊU CỨNG & DẬP TẮT DAO ĐỘNG (Stiff & Heavily Damped)
# R_t = exp(-35*theta^2 - 1.8*dtheta^2 - 20*x^2) - 0.08*(a_t - a_{t-1})^2 - 0.02*a_t^2
reward_weights:
  use_exponential: true         # Sử dụng hàm thưởng dốc nhọn (Exponential Peak)
  k_theta: 35.0                 # Hệ số dốc góc: góc > 1.5° điểm tụt dốc cực nhanh
  k_dtheta: 1.80                # Khâu cản đạo hàm dập tắt dao động lắc lư hình sin
  k_pos: 20.0                   # Khâu neo vị trí: ép xe đứng trong bán kính < 3 cm
  w_action_diff: 0.08           # Phạt rung giật motor (a_t - a_{t-1})^2
  w_action: 0.02                # Phạt tiêu tốn năng lượng motor
  fall_penalty: 50.0            # Phạt ngã nặng

# 5. CẤU HÌNH THUẬT TOÁN STABLE-BASELINES3
rl_training:
  algorithm: "PPO"
  net_arch: [64, 64]
  total_timesteps: 300000       # 300,000 bước huấn luyện để hội tụ thật chắc
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  n_steps: 2048
  ent_coef: 0.0005              # Giảm entropy để chính sách ổn định và chắc tay

# 6. XUẤT MÔ HÌNH VÀ DEPLOY LÊN STM32
export:
  checkpoint_dir: "outputs/checkpoints"
  figures_dir: "outputs/figures"
  header_output_dir: "outputs/firmware_headers"
  header_filename: "rl_sb3_stm32.h"
